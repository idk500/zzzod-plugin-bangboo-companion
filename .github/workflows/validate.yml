name: Validate Plugin

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate repository
        run: python scripts/validate_plugin.py --repo . --strict

      - name: Build and validate release asset
        run: |
          python scripts/build_zip.py --repo . --out dist
          python scripts/validate_plugin.py --zip dist/bangboo_companion.zip
